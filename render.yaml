# Render Blueprint — https://render.com/docs/blueprint-spec
# One-time setup: Render dashboard → New → Blueprint → select this repository → branch "render".
# After that every push to the "render" branch triggers a deploy (autoDeploy).
services:
  - type: web
    name: phrapedia
    runtime: node
    plan: starter            # a persistent disk (below) needs a paid instance; drop "disk" to try the free plan (data is then lost on each deploy)
    region: singapore        # closest region to Thailand/Japan; change as you like
    branch: render
    autoDeploy: true
    # Antigravity CLI (agy) is installed by its official script into ~/.local/bin and copied into the project dir
    buildCommand: npm ci && npm run build && (curl -fsSL https://antigravity.google/cli/install.sh | bash) && mkdir -p bin && cp "$HOME/.local/bin/agy" bin/agy && chmod +x bin/agy
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/health
    disk:
      name: phrapedia-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Records / primary sources / PGlite live on the persistent disk (seeded from the repo on first start)
      - key: NUXT_DATA_DIR
        value: /var/data/data
      - key: NUXT_SOURCES_DIR
        value: /var/data/sources
      - key: NUXT_STATE_DIR
        value: /var/data/state
      # Antigravity CLI (agy) built into bin/ (see buildCommand); authenticated with GEMINI_API_KEY (set in the dashboard).
      # scripts/render-start.mjs writes modelProvider: "gemini" into ~/.gemini/antigravity-cli/settings.json when the key is present.
      - key: NUXT_GEMINI_ENGINE
        value: antigravity
      - key: NUXT_GEMINI_COMMAND
        value: /opt/render/project/src/bin/agy
      # Secrets — set these in the Render dashboard (sync: false = never stored in this file)
      - key: NUXT_ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Basic authentication for the public URL (strongly recommended: the app has no login of its own)
      - key: NUXT_BASIC_AUTH_USER
        sync: false
      - key: NUXT_BASIC_AUTH_PASSWORD
        sync: false
